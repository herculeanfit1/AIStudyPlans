# Dependabot configuration file
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Etc/UTC"
    # Apply our exact versioning strategy
    versioning-strategy: "lockfile-only"
    # Limit the number of open PRs to avoid overwhelming
    open-pull-requests-limit: 5
    # Add specific reviewers and labels
    labels:
      - "dependencies"
      - "npm"
    # Group updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "*-loader"
          - "jest*"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "ts-*"
        update-types:
          - "minor"
          - "patch"
      react-ecosystem:
        patterns:
          - "react*"
          - "next*"
        update-types:
          - "patch"
    # Security updates should always be separate
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Enable GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Actions are pinned major-float (@vN) per STANDARDS § 15. A minor or patch
    # bump rewrites that to an exact @vN.N.N — the form the same rule forbids,
    # so Dependabot manufactures an S28 violation on a schedule, and CI passes
    # it, because standards-check.yml does not validate pin form.
    #
    # This costs nothing in security terms: @vN already resolves to the newest
    # N.x tag at run time, so patches arrive without a PR. Only majors need a
    # human, and a major bump keeps the major-float form.
    #
    # Scoped by namespace, NOT "*", and the distinction is load-bearing. Some
    # actions cannot be major-float pinned and depend on these PRs as their only
    # upgrade signal: aquasecurity/trivy-action is exact by design (§ 15
    # exemption), and hadolint/hadolint-action publishes no v3 tag at all —
    # only v3.0.0 … v3.4.0. A blanket "*" would silently freeze both.
    ignore:
      - dependency-name: "actions/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "github/codeql-action*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "ci"
      include: "scope" 
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "10:00"
      timezone: "Etc/UTC"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"

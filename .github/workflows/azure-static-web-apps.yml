# Deployment-only workflow for SchedulEd
# Validation (lint, typecheck, tests) runs locally before push via: npm run validate
# This workflow only builds and deploys to Azure Static Web Apps

name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

# Production and PR previews must never share a concurrency group.
# On a merged PR's `closed` event, github.ref is refs/heads/main -- the same
# ref as the push that the merge creates. With the old `deploy-${{ github.ref }}`
# key and cancel-in-progress, the two runs raced and the later one cancelled the
# earlier: 24 production deploys were cancelled by the merge's own PR-close run,
# and 6 PR-close cleanups were cancelled by the push (measured 2026-09-26 over
# all 160 retained runs; every cancelled run carried "Canceling since a higher
# priority waiting request for deploy-refs/heads/main exists").
# - Every pull_request event (opened/synchronize/reopened/closed) is keyed by PR
#   number, so no PR event can enter the production group.
# - push and workflow_dispatch share `swa-production`, where cancel-in-progress is
#   false: a newer production run waits, it never cancels a running deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('swa-preview-{0}', github.event.pull_request.number) || 'swa-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: |
          chmod +x ci-build.sh
          ./ci-build.sh
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://aistudyplans.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RESEND_CONFIGURED: ${{ secrets.RESEND_API_KEY && secrets.EMAIL_FROM && secrets.EMAIL_REPLY_TO && 'true' || 'false' }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
          skip_app_build: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RESEND_CONFIGURED: ${{ secrets.RESEND_API_KEY && secrets.EMAIL_FROM && secrets.EMAIL_REPLY_TO && 'true' || 'false' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview
    timeout-minutes: 5
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "/"
